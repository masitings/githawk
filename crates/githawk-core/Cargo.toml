[package]
name = "githawk-core"
description = "Git read layer for GitHawk"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# ponytail: local reads only; network/auth go through git CLI per PRD §8
git2 = { version = "0.20", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3"
